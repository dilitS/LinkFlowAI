name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Lint, test, build & package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full verification
        run: npm run verify

      - name: Package release ZIP
        run: npm run package:only

      - name: Validate ZIP contents
        run: node scripts/validate-zip.js

      - name: Check clean working tree after build
        run: |
          git diff --exit-code popup/output.css || (
            echo "::error::popup/output.css changed after build — commit the generated CSS or adjust CI"
            exit 1
          )

  e2e:
    name: Extension E2E smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:css && npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
